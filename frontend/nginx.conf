# One address for everything: http://localhost:3000
#   /api, /django-admin, /static -> Django
#   everything else        -> React app
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;   # room for backup restore uploads (Phase 6)

  location ~ ^/(api|django-admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # React Router: unknown paths load index.html
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
