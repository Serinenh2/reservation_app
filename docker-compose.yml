# Starts the whole application on this laptop.
#   docker compose up -d --build   -> start
#   docker compose down            -> stop (data is kept)
# NEVER run "docker compose down -v": -v deletes the database volume.

x-backend-common: &backend-common
  build: ./backend
  env_file: .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - db_data:/app/data          # SQLite database (persistent)
    - ./backups:/app/backups     # backup files, visible in the project folder
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-common
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"                # open http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
